<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home — Recovery App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,600&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="theme.css" />
  <style>
    /* ── App-init overlay ──────────────────────────────── */
    #app-init {
      position: fixed;
      inset: 0;
      background: #eef1f4;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .app-init-spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(63,143,116,.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .visually-hidden {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    /* ── Status chips row ──────────────────────────────── */
    .home-status { display: flex; align-items: center; gap: 10px; }
    .chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      padding: 8px 14px;
      box-shadow: 0 4px 16px rgba(31,41,55,.06);
    }
    .chip-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .dot-amber { background: var(--accent2); }
    .dot-green { background: var(--accent); }
    .chip-num { font-size: 13px; font-weight: 700; color: var(--ink); }
    .chip-unit { font-size: 11px; color: var(--muted); }
    .chip-label { font-size: 11px; color: var(--muted); }
    .status-spacer { flex: 1; }
    .avatar {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 13px; font-weight: 700;
      box-shadow: 0 4px 14px rgba(31,41,55,.12);
      flex-shrink: 0;
    }

    /* ── Greeting ──────────────────────────────────────── */
    .header-date { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
    .greeting { font-size: 27px; font-weight: 700; color: var(--ink); line-height: 1.2; }

    /* ── Streak card + progress ring ───────────────────── */
    .streak-card {
      border-radius: 30px;
      padding: 26px 20px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card-eyebrow {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
    }
    .ring-wrap { position: relative; width: 132px; height: 132px; margin-bottom: 14px; }
    .ring-wrap svg { transform: rotate(-90deg); }
    .ring-progress { transition: stroke-dashoffset 0.7s var(--ease); }
    .ring-center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    .ring-num {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 42px; font-weight: 800; color: var(--ink); letter-spacing: -0.02em;
    }
    .hero-tone {
      font-size: 15px; font-weight: 700; color: var(--ink);
      text-align: center; line-height: 1.4;
    }

    /* ── Today card ────────────────────────────────────── */
    .today-card { border-radius: 26px; padding: 18px; }
    .today-q { font-size: 15px; font-weight: 700; color: var(--ink); margin-bottom: 12px; }
    .btn-checkin {
      display: block;
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dk));
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.15s var(--ease);
    }
    .btn-checkin:active { transform: scale(0.98); }
    .btn-checkin:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(63,143,116,.5); }
    .checkin-loading { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 14px; }
    .checkin-spinner {
      width: 20px; height: 20px;
      border: 2px solid rgba(63,143,116,.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    .checkin-done-q { font-size: 15px; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
    .checkin-done-tomorrow { font-size: 13px; color: var(--muted); }

    /* ── Personal why card ─────────────────────────────── */
    .why-card {
      background: linear-gradient(135deg, rgba(232,149,107,.18), rgba(63,143,116,.14));
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 20px 18px;
      margin-top: auto;
    }
    .why-card[hidden] { display: none; }
    .why-eyebrow {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
    }
    .why-text {
      font-family: 'Fraunces', serif;
      font-size: 19px;
      font-style: italic;
      font-weight: 600;
      line-height: 1.5;
      color: var(--ink);
      margin: 0;
      padding: 0;
      border: none;
    }
  </style>
</head>
<body class="glass-ui">
<div id="app-init" aria-hidden="true"><div class="app-init-spinner"></div></div>
<a class="skip-link" href="#home-main">Skip to main content</a>

<main id="home-main" class="shell">

  <!-- ── Status chips + avatar ────────────────────────────── -->
  <div class="home-status">
    <div class="chip">
      <span class="chip-dot dot-amber" aria-hidden="true"></span>
      <span class="chip-num" id="streak-chip">—</span>
      <span class="chip-unit">days</span>
    </div>
    <div class="chip">
      <span class="chip-dot dot-green" aria-hidden="true"></span>
      <span class="chip-label" id="phase-chip">—</span>
    </div>
    <div class="status-spacer"></div>
    <div class="avatar" id="avatar" aria-hidden="true">·</div>
  </div>

  <!-- ── Greeting ─────────────────────────────────────────── -->
  <div>
    <p class="header-date" id="today-date"></p>
    <h1 class="greeting" id="greeting">Good morning.</h1>
  </div>

  <!-- ── Streak card ──────────────────────────────────────── -->
  <section class="glass streak-card" aria-label="Current streak">
    <div class="card-eyebrow">Current streak</div>
    <div class="ring-wrap" aria-hidden="true">
      <svg width="132" height="132" viewBox="0 0 132 132">
        <circle cx="66" cy="66" r="56" fill="none" stroke="rgba(32,42,55,.09)" stroke-width="11"></circle>
        <circle id="progress-ring" class="ring-progress" cx="66" cy="66" r="56" fill="none" stroke="var(--accent)" stroke-width="11" stroke-linecap="round" stroke-dasharray="352" stroke-dashoffset="352"></circle>
      </svg>
      <div class="ring-center">
        <span class="ring-num" id="hero-num">—</span>
      </div>
    </div>
    <span class="visually-hidden" id="hero-label">days sober</span>
    <p class="hero-tone" id="hero-tone">You are building trust with yourself, one day at a time.</p>
  </section>

  <!-- ── Today's check-in ─────────────────────────────────── -->
  <section class="glass today-card" aria-labelledby="checkin-card-heading">
    <!-- Loading -->
    <div class="checkin-loading" id="checkin-loading">
      <div class="checkin-spinner" aria-hidden="true"></div>
      <span>Just a moment…</span>
    </div>

    <!-- Not yet checked in -->
    <div id="checkin-todo" hidden>
      <p class="today-q" id="checkin-card-heading">How are you doing today?</p>
      <a class="btn-checkin" href="checkin.html">Check in today →</a>
    </div>

    <!-- Already checked in -->
    <div id="checkin-done" hidden>
      <p class="checkin-done-q">You showed up today.</p>
      <p class="checkin-done-tomorrow">Come back tomorrow</p>
    </div>
  </section>

  <!-- ── Personal why ─────────────────────────────────────── -->
  <section class="why-card" id="why-card" hidden aria-labelledby="why-heading">
    <p class="why-eyebrow" id="why-heading">Your why</p>
    <blockquote class="why-text" id="why-text"></blockquote>
  </section>

</main>

<nav class="bottom-nav" aria-label="Primary navigation">
  <div class="nav-pill">
    <a class="nav-tab active" href="index.html" aria-current="page">Home</a>
    <a class="nav-tab" href="streak.html">Streak</a>
  </div>
  <a class="nav-sos" href="sos.html" aria-label="Craving SOS — get support now">SOS</a>
</nav>

<script type="module">
  import { supabase } from './supabase.js';

  // ── Auth guard ─────────────────────────────────────────────
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) {
    window.location.replace('onboarding.html');
    await new Promise(() => {}); // halt module while browser navigates
  }
  document.getElementById('app-init').remove();

  const profileId = localStorage.getItem('profileId') || session.user.id;
  const todayISO = new Date().toISOString().split('T')[0];

  // ── Greeting + date ────────────────────────────────────────
  document.getElementById('today-date').textContent = new Date().toLocaleDateString('en-US', {
    weekday: 'long', month: 'long', day: 'numeric'
  });

  function setGreeting(name) {
    const h = new Date().getHours();
    const suffix = name ? `, ${name}.` : '.';
    const el = document.getElementById('greeting');
    if (h < 12)       el.textContent = `Good morning${suffix}`;
    else if (h < 17)  el.textContent = `Good afternoon${suffix}`;
    else              el.textContent = `Good evening${suffix}`;
  }
  setGreeting(null);

  // ── Streak helpers ─────────────────────────────────────────
  const MILESTONES = [1, 7, 30, 90, 365];

  function getNextMilestone(d) { return MILESTONES.find(m => m > d) || null; }
  function getPrevMilestone(d) {
    const passed = MILESTONES.filter(m => m <= d);
    return passed.length ? passed[passed.length - 1] : 0;
  }

  function toneForDay(d) {
    if (d <= 0)   return 'The journey starts now. One moment at a time.';
    if (d === 1)  return 'Day 1 counts. You showed up for yourself today.';
    if (d < 7)   return 'Gentle start. One honest day at a time — that\'s enough.';
    if (d < 30)  return 'Building rhythm. Small daily steps are adding up.';
    if (d < 90)  return 'Steady momentum. You are showing up and building trust with yourself.';
    if (d < 365) return 'Deep commitment. The work you\'ve put in is real and lasting.';
    return 'A full year. This is huge, and you earned every single day.';
  }

  // Short phase label for the status chip (toneForDay sentences are too long here)
  function phaseFor(d) {
    if (d <= 0)  return 'Just beginning';
    if (d < 7)   return 'Getting started';
    if (d < 30)  return 'Building rhythm';
    if (d < 90)  return 'Steady momentum';
    if (d < 365) return 'Deep commitment';
    return 'A full year+';
  }

  const RING_CIRCUMFERENCE = 352; // 2πr, r=56 (matches stroke-dasharray)

  function renderStreak(day) {
    const d = Math.max(0, day);
    document.getElementById('hero-num').textContent = String(d);
    document.getElementById('hero-label').textContent = d === 1 ? 'day sober' : 'days sober';
    document.getElementById('hero-tone').textContent = toneForDay(d);
    document.getElementById('streak-chip').textContent = String(d);
    document.getElementById('phase-chip').textContent = phaseFor(d);

    const next = getNextMilestone(d);
    const prev = getPrevMilestone(d);
    const pct = next ? (d <= prev ? 0 : ((d - prev) / (next - prev)) * 100) : 100;
    document.getElementById('progress-ring').style.strokeDashoffset =
      RING_CIRCUMFERENCE * (1 - pct / 100);
  }

  // ── Parallel data fetch ────────────────────────────────────
  const [profileResult, checkinResult] = await Promise.all([
    supabase.from('profiles')
      .select('name, sobriety_start_date, personal_why')
      .eq('id', profileId)
      .single(),
    supabase.from('checkins')
      .select('id, sober, mood')
      .eq('profile_id', profileId)
      .eq('checked_in_at', todayISO)
      .maybeSingle()
  ]);

  // ── Hide loading ───────────────────────────────────────────
  document.getElementById('checkin-loading').style.display = 'none';

  // ── Render profile data ────────────────────────────────────
  const profile = profileResult.data;
  if (profile) {
    setGreeting(profile.name);
    document.getElementById('avatar').textContent =
      (profile.name || '').trim().charAt(0).toUpperCase() || '·';
    if (profile.sobriety_start_date) {
      const diffDays = Math.floor(
        (Date.now() - new Date(profile.sobriety_start_date).getTime()) / 86400000
      );
      renderStreak(Math.max(0, diffDays));
    }
    if (profile.personal_why) {
      document.getElementById('why-text').textContent = profile.personal_why;
      document.getElementById('why-card').hidden = false;
    }
  }

  // ── Render check-in status ─────────────────────────────────
  const lastCheckin = localStorage.getItem('lastCheckin');
  const checkin = checkinResult.data;
  if (lastCheckin === todayISO || checkin) {
    document.getElementById('checkin-done').hidden = false;
  } else {
    document.getElementById('checkin-todo').hidden = false;
  }
</script>
</body>
</html>
