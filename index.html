<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home — Recovery App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="theme.css" />
  <style>
    /* ── App-init overlay ──────────────────────────────── */
    #app-init {
      position: fixed;
      inset: 0;
      background: #f6f2ea;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .app-init-spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(47,85,80,.15);
      border-top-color: #3b6a64;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Shell ─────────────────────────────────────────── */
    .shell {
      padding: 20px 16px 0;
      gap: 12px;
    }

    /* ── Header ────────────────────────────────────────── */
    .home-header {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .greeting {
      font-size: 20px;
      font-weight: 600;
      color: var(--ink-900);
      line-height: 1.2;
    }
    .header-date {
      font-size: 13px;
      color: var(--ink-300);
      font-weight: 500;
      margin-top: 3px;
    }

    /* ── Streak hero block ─────────────────────────────── */
    .streak-hero-block {
      text-align: center;
      padding: 8px 0 4px;
    }
    .hero-num {
      font-family: 'Fraunces', serif;
      font-size: 108px;
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--sage-700);
      margin-bottom: 4px;
    }
    .hero-label {
      font-family: 'Inter', sans-serif;
      font-size: 18px;
      font-weight: 400;
      color: var(--ink-300);
      margin-bottom: 12px;
    }
    .hero-tone {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-size: 20px;
      line-height: 1.5;
      color: var(--ink-700);
      margin-bottom: 20px;
    }

    /* ── Progress bar ──────────────────────────────────── */
    .progress-bar-wrap { margin-bottom: 0; }
    .progress-bar-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 500;
      color: var(--ink-300);
      margin-bottom: 6px;
    }
    .progress-bar-track {
      height: 5px;
      background: var(--sage-50);
      border-radius: var(--radius-pill);
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--sage-700);
      border-radius: var(--radius-pill);
      transition: width 0.6s var(--ease);
    }

    /* ── Card ──────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-soft);
      padding: 24px;
    }

    /* ── Card eyebrow ──────────────────────────────────── */
    .card-eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-500);
      margin-bottom: 12px;
    }

    /* ── Check-in card ─────────────────────────────────── */
    .checkin-loading {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--ink-300);
      font-size: 14px;
    }
    .checkin-spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--sage-100);
      border-top-color: var(--sage-700);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    .checkin-cta-heading {
      font-family: 'Fraunces', serif;
      font-size: 20px;
      font-weight: 600;
      color: var(--ink-900);
      margin-bottom: 16px;
      line-height: 1.3;
    }
    .btn-checkin {
      display: block;
      width: 100%;
      padding: 17px;
      border-radius: var(--radius-pill);
      background: var(--sage-700);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      box-shadow: 0 4px 16px rgba(47,85,80,.2);
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      font-family: 'Inter', inherit;
    }
    .btn-checkin:hover {
      background: var(--sage-600);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(47,85,80,.28);
    }
    .btn-checkin:active { transform: scale(0.97); }
    .btn-checkin:focus-visible {
      outline: none;
      box-shadow: var(--focus-ring);
    }

    /* ── Check-in done state ───────────────────────────── */
    .checkin-done-tomorrow {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: var(--ink-300);
      text-align: center;
    }

    /* ── Personal why card ─────────────────────────────── */
    .why-card {
      background: var(--warn-50);
      border: 1px solid #e8d5b0;
      border-radius: var(--radius-lg);
    }
    .why-card[hidden] { display: none; }
    .why-card .card-eyebrow {
      font-size: 10px;
      color: var(--ink-300);
    }
    .why-text {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-size: 18px;
      font-weight: 500;
      line-height: 1.6;
      color: var(--ink-900);
      margin: 0;
      padding: 0;
      border: none;
    }
  </style>
</head>
<body>
<div id="app-init" aria-hidden="true"><div class="app-init-spinner"></div></div>
<a class="skip-link" href="#home-main">Skip to main content</a>

<main id="home-main" class="shell">

  <!-- ── Header ───────────────────────────────────────────── -->
  <header class="home-header">
    <div>
      <p class="greeting" id="greeting">Good morning.</p>
      <p class="header-date" id="today-date"></p>
    </div>
  </header>

  <!-- ── Streak hero ──────────────────────────────────────── -->
  <section class="streak-hero-block" aria-label="Current streak">
    <div class="hero-num" id="hero-num">—</div>
    <p class="hero-label" id="hero-label">days sober</p>
    <p class="hero-tone" id="hero-tone">You are building trust with yourself, one day at a time.</p>
    <div class="progress-bar-wrap" aria-hidden="true">
      <div class="progress-bar-meta">
        <span id="progress-from">—</span>
        <span id="progress-to">—</span>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
      </div>
    </div>
  </section>

  <!-- ── Today's check-in ─────────────────────────────────── -->
  <section class="card" aria-labelledby="checkin-card-heading">
    <p class="card-eyebrow" id="checkin-card-heading">Today</p>

    <!-- Loading -->
    <div class="checkin-loading" id="checkin-loading">
      <div class="checkin-spinner" aria-hidden="true"></div>
      <span>Just a moment…</span>
    </div>

    <!-- Not yet checked in -->
    <div id="checkin-todo" hidden>
      <p class="checkin-cta-heading">How are you doing today?</p>
      <a class="btn-checkin" href="checkin.html">Check in today →</a>
    </div>

    <!-- Already checked in -->
    <div id="checkin-done" hidden>
      <p class="checkin-cta-heading">You showed up today.</p>
      <p class="checkin-done-tomorrow">Come back tomorrow</p>
    </div>
  </section>

  <!-- ── Personal why ─────────────────────────────────────── -->
  <section class="card why-card" id="why-card" hidden aria-labelledby="why-heading">
    <p class="card-eyebrow" id="why-heading">Your why</p>
    <blockquote class="why-text" id="why-text"></blockquote>
  </section>

</main>

<nav class="bottom-nav" aria-label="Primary navigation">
  <a class="tab active" href="index.html" aria-current="page">
    <span class="tab-icon" aria-hidden="true">⌂</span>
    <span class="tab-label">Home</span>
  </a>
  <a class="tab tab-sos" href="sos.html" aria-label="Craving SOS — get support now">
    <span class="tab-label">SOS</span>
  </a>
  <a class="tab" href="streak.html">
    <span class="tab-icon" aria-hidden="true">✦</span>
    <span class="tab-label">Streak</span>
  </a>
</nav>

<script type="module">
  import { supabase } from './supabase.js';

  // ── Auth guard ─────────────────────────────────────────────
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) {
    window.location.replace('onboarding.html');
    await new Promise(() => {}); // halt module while browser navigates
  }
  document.getElementById('app-init').remove();

  const profileId = localStorage.getItem('profileId') || session.user.id;
  const todayISO = new Date().toISOString().split('T')[0];

  // ── Greeting + date ────────────────────────────────────────
  document.getElementById('today-date').textContent = new Date().toLocaleDateString('en-US', {
    weekday: 'long', month: 'long', day: 'numeric'
  });

  function setGreeting(name) {
    const h = new Date().getHours();
    const suffix = name ? `, ${name}.` : '.';
    const el = document.getElementById('greeting');
    if (h < 12)       el.textContent = `Good morning${suffix}`;
    else if (h < 17)  el.textContent = `Good afternoon${suffix}`;
    else              el.textContent = `Good evening${suffix}`;
  }
  setGreeting(null);

  // ── Streak helpers ─────────────────────────────────────────
  const MILESTONES = [1, 7, 30, 90, 365];

  function getNextMilestone(d) { return MILESTONES.find(m => m > d) || null; }
  function getPrevMilestone(d) {
    const passed = MILESTONES.filter(m => m <= d);
    return passed.length ? passed[passed.length - 1] : 0;
  }

  function toneForDay(d) {
    if (d <= 0)   return 'The journey starts now. One moment at a time.';
    if (d === 1)  return 'Day 1 counts. You showed up for yourself today.';
    if (d < 7)   return 'Gentle start. One honest day at a time — that\'s enough.';
    if (d < 30)  return 'Building rhythm. Small daily steps are adding up.';
    if (d < 90)  return 'Steady momentum. You are showing up and building trust with yourself.';
    if (d < 365) return 'Deep commitment. The work you\'ve put in is real and lasting.';
    return 'A full year. This is huge, and you earned every single day.';
  }

  function renderStreak(day) {
    const d = Math.max(0, day);
    document.getElementById('hero-num').textContent = String(d);
    document.getElementById('hero-label').textContent = d === 1 ? 'day sober' : 'days sober';
    document.getElementById('hero-tone').textContent = toneForDay(d);

    const next = getNextMilestone(d);
    const prev = getPrevMilestone(d);
    if (next) {
      const pct = d <= prev ? 0 : Math.round(((d - prev) / (next - prev)) * 100);
      document.getElementById('progress-fill').style.width = pct + '%';
      document.getElementById('progress-from').textContent = `Day ${d}`;
      document.getElementById('progress-to').textContent = `Next: Day ${next}`;
    } else {
      document.getElementById('progress-fill').style.width = '100%';
      document.getElementById('progress-from').textContent = `Day ${d}`;
      document.getElementById('progress-to').textContent = '🎉 All milestones';
    }
  }

  // ── Parallel data fetch ────────────────────────────────────
  const [profileResult, checkinResult] = await Promise.all([
    supabase.from('profiles')
      .select('name, sobriety_start_date, personal_why')
      .eq('id', profileId)
      .single(),
    supabase.from('checkins')
      .select('id, sober, mood')
      .eq('profile_id', profileId)
      .eq('checked_in_at', todayISO)
      .maybeSingle()
  ]);

  // ── Hide loading ───────────────────────────────────────────
  document.getElementById('checkin-loading').style.display = 'none';

  // ── Render profile data ────────────────────────────────────
  const profile = profileResult.data;
  if (profile) {
    setGreeting(profile.name);
    if (profile.sobriety_start_date) {
      const diffDays = Math.floor(
        (Date.now() - new Date(profile.sobriety_start_date).getTime()) / 86400000
      );
      renderStreak(Math.max(0, diffDays));
    }
    if (profile.personal_why) {
      document.getElementById('why-text').textContent = profile.personal_why;
      document.getElementById('why-card').hidden = false;
    }
  }

  // ── Render check-in status ─────────────────────────────────
  const lastCheckin = localStorage.getItem('lastCheckin');
  const checkin = checkinResult.data;
  if (lastCheckin === todayISO || checkin) {
    document.getElementById('checkin-done').hidden = false;
  } else {
    document.getElementById('checkin-todo').hidden = false;
  }
</script>
</body>
</html>
